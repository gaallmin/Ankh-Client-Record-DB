name: Migrate and Test Staging Database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ankh-staging-database
  cancel-in-progress: false

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: ankh-client-app
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
      TEST_DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
      RUN_DB_INTEGRATION_TESTS: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ankh-client-app/package-lock.json
      - run: npm ci
      - name: Run unit and API authorization tests
        run: npm test
      - name: Refuse production database identities
        run: npm run db:staging:guard
      - name: Apply reviewed migrations to staging
        run: npx prisma migrate deploy
      - name: Run database authorization and concurrency tests
        run: npm run test:integration
